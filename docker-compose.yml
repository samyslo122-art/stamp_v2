version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: event_passport_db
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-school_event}
      POSTGRES_USER: ${DB_USER:-event_user}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-strong_password_here}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-event_user} -d ${DB_NAME:-school_event}"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
